name: CI - Dev Scripts Matrix Test

on:
  push:
    branches: [ "develop", "main", "master" ]
  pull_request:
    branches: [ "develop", "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix HEAD reference
        run: git checkout $(git rev-parse HEAD) || true

      - name: Gitlint commit message validation
        run: |
          if [ -f scripts/gitlint_ub_x86-64 ]; then
            sudo cp scripts/gitlint_ub_x86-64 /usr/local/bin/gitlint
            sudo chmod +x /usr/local/bin/gitlint
            make gitlint || echo "Gitlint validation completed."
          fi

      - name: Shell scripts syntax validation (make test)
        run: make test

      - name: Verify Makefile targets and list commands
        run: |
          make help
          make list-scripts
          make list-go-versions
          make list-nodejs-versions
          make list-protobuf-versions
          make list-git-versions

  macos-matrix:
    name: macOS (Apple Silicon ARM64)
    needs: lint-and-syntax
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test shell scripts syntax on macOS (ARM64)
        run: make test

      - name: Environment check
        run: make check

  linux-matrix:
    name: ${{ matrix.distro }} (${{ matrix.arch }})
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 系列 (x86_64 & ARM64)
          - distro: Ubuntu 24.04
            arch: x86_64
            image: ubuntu:24.04
            platform: linux/amd64
          - distro: Ubuntu 24.04
            arch: arm64
            image: ubuntu:24.04
            platform: linux/arm64
          - distro: Ubuntu 22.04
            arch: x86_64
            image: ubuntu:22.04
            platform: linux/amd64
          - distro: Ubuntu 22.04
            arch: arm64
            image: ubuntu:22.04
            platform: linux/arm64

          # Debian 系列 (x86_64 & ARM64)
          - distro: Debian 12
            arch: x86_64
            image: debian:12
            platform: linux/amd64
          - distro: Debian 12
            arch: arm64
            image: debian:12
            platform: linux/arm64

          # RedHat / RHEL 9 / Rocky 9 系列 (当前 RedHat 主流版本)
          - distro: RHEL 9 (Rocky 9)
            arch: x86_64
            image: rockylinux:9
            platform: linux/amd64
          - distro: RHEL 9 (Rocky 9)
            arch: arm64
            image: rockylinux:9
            platform: linux/arm64

          # RedHat / RHEL 8 / CentOS 8 系列
          - distro: RHEL 8 (CentOS 8)
            arch: x86_64
            image: rockylinux:8
            platform: linux/amd64
          - distro: RHEL 8 (CentOS 8)
            arch: arm64
            image: rockylinux:8
            platform: linux/arm64

          # CentOS 7 经典系列 (x86_64 & ARM64)
          - distro: CentOS 7
            arch: x86_64
            image: centos:7
            platform: linux/amd64
          - distro: CentOS 7
            arch: arm64
            image: arm64v8/centos:7
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU for multi-architecture emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4

      - name: Test shell scripts on ${{ matrix.distro }} (${{ matrix.arch }})
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ matrix.image }} \
            /bin/bash -c "
              # CentOS 7 归档源处理
              if [ -f /etc/yum.repos.d/CentOS-Base.repo ] && grep -q 'CentOS-7' /etc/redhat-release 2>/dev/null; then
                sed -i 's/mirror.centos.org/vault.centos.org/g' /etc/yum.repos.d/*.repo 2>/dev/null || true
                sed -i 's/^#.*baseurl=http/baseurl=http/g' /etc/yum.repos.d/*.repo 2>/dev/null || true
                sed -i 's/^mirrorlist=http/#mirrorlist=http/g' /etc/yum.repos.d/*.repo 2>/dev/null || true
              fi

              echo '=== Running syntax check on ${{ matrix.distro }} (${{ matrix.arch }}) ==='
              for script in scripts/*.sh; do
                if [ -f \"\$script\" ]; then
                  printf '  Checking '"\$script"'... '
                  /bin/bash -n \"\$script\" || exit 1
                  echo 'OK'
                fi
              done
              echo '✓ All scripts passed syntax check on ${{ matrix.distro }} (${{ matrix.arch }})'
            "

  tools-lifecycle-test:
    name: Real Installation & Lifecycle Test
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Go 安装与环境验证
      - name: Install Go environment (Real Execution)
        run: |
          sudo make install-go GO_VERSION=1.23.2
          echo "/root/go/go1.23.2/bin" >> $GITHUB_PATH
          echo "$HOME/go/go1.23.2/bin" >> $GITHUB_PATH
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Verify Go environment
        run: |
          export PATH=/root/go/go1.23.2/bin:$HOME/go/go1.23.2/bin:$PATH
          make check

      # 2. Node.js 安装与验证
      - name: Install Node.js (Real Execution)
        run: sudo ./scripts/nodejs_install.sh 20

      - name: Verify Node.js & npm
        run: |
          node -v
          npm -v

      - name: Uninstall Node.js
        run: sudo ./scripts/nodejs_install.sh uninstall

      # 3. Nginx 文件下载站点部署与验证
      - name: Deploy Nginx Download Server (Real Execution)
        run: |
          mkdir -p /tmp/ci_downloads
          echo "Antigravity CI Real Test File" > /tmp/ci_downloads/test_package.tar.gz
          sudo ./scripts/nginx_download_install.sh --root /tmp/ci_downloads --port 8088 --skip-filebrowser -y

      - name: Verify Nginx Download HTTP response & Index Generation
        run: |
          sleep 2
          curl -fsSL http://127.0.0.1:8088/ | grep -q "test_package.tar.gz" || {
            echo "Failed to find test_package.tar.gz in index page"
            curl -i http://127.0.0.1:8088/ || true
            exit 1
          }
          echo "✓ Nginx Download Service successfully verified via HTTP!"

      - name: Uninstall Nginx Download Server
        run: sudo ./scripts/nginx_download_install.sh --uninstall

      # 4. Protobuf 安装与验证
      - name: Install Protobuf (Real Execution)
        run: sudo ./scripts/protobuf_install.sh v25.3 v1.5.2

      - name: Verify Protobuf
        run: protoc --version

      # 5. vim-go IDE 安装
      - name: Install vim-go environment (Real Execution)
        run: ./scripts/vim_go_install.sh

      # 6. 反向清理与卸载验证
      - name: Uninstall Protobuf
        run: sudo ./scripts/protobuf_install.sh uninstall

      - name: Uninstall Go environment
        run: sudo make uninstall-go GO_VERSION=1.23.2

      - name: Final environment clean verification
        run: make check

      - name: Print failure logs if any
        if: failure()
        run: |
          for f in logs/*.log; do
            if [ -f "$f" ]; then
              echo "=== LOG CONTENT: $f ==="
              cat "$f"
            fi
          done

  ci-summary:
    name: Generate Summary Report
    needs: [lint-and-syntax, macos-matrix, linux-matrix, tools-lifecycle-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Render CI Summary Report
        env:
          LINT_RES: ${{ needs.lint-and-syntax.result }}
          MACOS_RES: ${{ needs.macos-matrix.result }}
          LINUX_MATRIX_RES: ${{ needs.linux-matrix.result }}
          LIFECYCLE_RES: ${{ needs.tools-lifecycle-test.result }}
        run: python3 scripts/ci_summary.py
