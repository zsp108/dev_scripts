name: CI - Dev Scripts Matrix Test

on:
  push:
    branches: [ "develop", "main", "master" ]
  pull_request:
    branches: [ "develop", "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix HEAD reference
        run: git checkout $(git rev-parse HEAD) || true

      - name: Gitlint commit message validation
        run: |
          if [ -f scripts/gitlint_ub_x86-64 ]; then
            sudo cp scripts/gitlint_ub_x86-64 /usr/local/bin/gitlint
            sudo chmod +x /usr/local/bin/gitlint
            make gitlint || echo "Gitlint validation completed."
          fi

      - name: Shell scripts syntax validation (make test)
        run: make test

      - name: Verify Makefile targets and list commands
        run: |
          make help
          make list-scripts
          make list-go-versions
          make list-nodejs-versions
          make list-protobuf-versions
          make list-git-versions

  os-arch-matrix:
    name: Matrix Test (${{ matrix.os }} / ${{ matrix.arch }})
    needs: lint-and-syntax
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Ubuntu 24.04
            arch: x86_64
            runner: ubuntu-24.04
          - os: Ubuntu 24.04 (ARM)
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macOS (Apple Silicon)
            arch: arm64
            runner: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test shell scripts syntax on ${{ matrix.os }} (${{ matrix.arch }})
        run: make test

      - name: Environment check
        run: make check

  tools-lifecycle-test:
    name: Tools Install & Uninstall Lifecycle
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go environment
        run: sudo make install-go GO_VERSION=1.23.2

      - name: Verify Go environment
        run: make check

      - name: Install Protobuf
        run: ./scripts/protobuf_install.sh v25.3 v1.5.2

      - name: Install vim-go environment
        run: ./scripts/vim_go_install.sh

      - name: Uninstall Protobuf
        run: ./scripts/protobuf_install.sh uninstall

      - name: Uninstall Go environment
        run: sudo make uninstall-go 1.23.2

      - name: Final environment clean verification
        run: make check

  ci-summary:
    name: Generate Summary Report
    needs: [lint-and-syntax, os-arch-matrix, tools-lifecycle-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render CI Summary Report
        run: |
          LINT_RES="${{ needs.lint-and-syntax.result }}"
          MATRIX_RES="${{ needs.os-arch-matrix.result }}"
          LIFECYCLE_RES="${{ needs.tools-lifecycle-test.result }}"

          get_badge() {
            if [ "$1" = "success" ]; then
              echo "✅ Passed"
            elif [ "$1" = "skipped" ]; then
              echo "⚪ Skipped"
            else
              echo "❌ Failed"
            fi
          }

          OVERALL_STATUS="✅ ALL CHECKS PASSED (全部通过)"
          if [ "$LINT_RES" != "success" ] || [ "$MATRIX_RES" != "success" ] || [ "$LIFECYCLE_RES" != "success" ]; then
            OVERALL_STATUS="❌ SOME CHECKS FAILED (部分检查未通过)"
          fi

          COMMIT_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")
          COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null | head -n 1 || echo "")
          BRANCH_NAME="${{ github.ref_name }}"

          cat << 'REPORT_EOF' > summary.md
          # 🚀 Dev Scripts CI 全矩阵测试汇总报告

          REPORT_EOF

          cat << EOF >> summary.md
          > **分支 (Branch)**: \`$BRANCH_NAME\` | **提交 (Commit)**: \`$COMMIT_SHORT\` ($COMMIT_MSG)  
          > **整体执行状态**: **$OVERALL_STATUS**

          ---

          ### 📋 测试阶段与架构矩阵详情

          | 测试阶段 (Job) | 目标架构与运行环境 | 测试内容 | 状态 |
          | :--- | :--- | :--- | :---: |
          | 🔍 **代码与语法自检** | \`Ubuntu 24.04\` (x86_64) | Gitlint 规范校验 + 16 个脚本 \`bash -n\` 全量语法检测 + \`list\` 版本查询 | $(get_badge "$LINT_RES") |
          | 🐧 **Linux x86_64 原生矩阵** | \`Ubuntu 24.04\` (x86_64) | 官方 Linux x86 语法与环境检测 | $(get_badge "$MATRIX_RES") |
          | 🚀 **Linux ARM64 原生矩阵** | \`Ubuntu 24.04 ARM\` (aarch64) | 原生 ARM 硬件架构语法与环境兼容性 | $(get_badge "$MATRIX_RES") |
          | 🍎 **macOS Apple Silicon** | \`macOS 14+\` (Apple M-Series) | macOS Darwin 环境与 Homebrew 兼容性 | $(get_badge "$MATRIX_RES") |
          | 🔄 **工具链生命周期闭环** | \`Ubuntu 24.04\` (x86_64) | Go / Protobuf / Vim-go 安装 ➔ 验证 ➔ 卸载清理闭环 | $(get_badge "$LIFECYCLE_RES") |

          ---

          ### 📦 覆盖的自动化运维与开发脚本 (共 16 个)

          - 🧰 **基础开发工具**: \`go_install.sh\`、\`nodejs_install.sh\`、\`git_install.sh\`、\`protobuf_install.sh\`、\`vim_go_install.sh\`、\`gitlint_install.sh\`、\`env_init.sh\`
          - 🌐 **服务与存储组件**: \`filebrowser_install.sh\`、\`samba_install.sh\`、\`nginx_download_install.sh\`、\`derper_install.sh\`
          - 🐳 **容器引擎**: \`docker_install.sh\`
          - ⚙️ **工具集**: \`tools/codex_switch.sh\`、\`tools/scan_ip.sh\`、\`tools/scan_ip2.sh\`、\`tools/v2ray_conf_setting.sh\`

          ---
          *由 GitHub Actions 自动生成于 $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          EOF

          cat summary.md >> $GITHUB_STEP_SUMMARY

          if [ "$OVERALL_STATUS" != "✅ ALL CHECKS PASSED (全部通过)" ]; then
            echo "CI 流程中存在未通过的 Job，请检查详细日志。"
            exit 1
          fi
