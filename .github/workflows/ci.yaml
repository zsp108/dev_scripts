name: CI - Dev Scripts Matrix Test

on:
  push:
    branches: [ "develop", "main", "master" ]
  pull_request:
    branches: [ "develop", "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix HEAD reference
        run: git checkout $(git rev-parse HEAD) || true

      - name: Gitlint commit message validation
        run: |
          if [ -f scripts/gitlint_ub_x86-64 ]; then
            sudo cp scripts/gitlint_ub_x86-64 /usr/local/bin/gitlint
            sudo chmod +x /usr/local/bin/gitlint
            make gitlint || echo "Gitlint validation completed."
          fi

      - name: Shell scripts syntax validation (make test)
        run: make test

      - name: Verify Makefile targets and list commands
        run: |
          make help
          make list-scripts
          make list-go-versions
          make list-nodejs-versions
          make list-protobuf-versions
          make list-git-versions

  os-arch-matrix:
    name: Matrix Test (${{ matrix.os }} / ${{ matrix.arch }})
    needs: lint-and-syntax
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Ubuntu 24.04
            arch: x86_64
            runner: ubuntu-24.04
          - os: Ubuntu 24.04 (ARM)
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macOS (Apple Silicon)
            arch: arm64
            runner: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test shell scripts syntax on ${{ matrix.os }} (${{ matrix.arch }})
        run: make test

      - name: Environment check
        run: make check

  tools-lifecycle-test:
    name: Tools Install & Uninstall Lifecycle
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go environment
        run: sudo make install-go GO_VERSION=1.23.2

      - name: Verify Go environment
        run: |
          export PATH=/root/go/go1.23.2/bin:$HOME/go/go1.23.2/bin:$PATH
          make check

      - name: Install Protobuf
        run: sudo ./scripts/protobuf_install.sh v25.3 v1.5.2

      - name: Verify Protobuf
        run: protoc --version

      - name: Install vim-go environment
        run: ./scripts/vim_go_install.sh

      - name: Uninstall Protobuf
        run: sudo ./scripts/protobuf_install.sh uninstall

      - name: Uninstall Go environment
        run: sudo make uninstall-go GO_VERSION=1.23.2

      - name: Final environment clean verification
        run: make check

  ci-summary:
    name: Generate Summary Report
    needs: [lint-and-syntax, os-arch-matrix, tools-lifecycle-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render CI Summary Report
        env:
          LINT_RES: ${{ needs.lint-and-syntax.result }}
          MATRIX_RES: ${{ needs.os-arch-matrix.result }}
          LIFECYCLE_RES: ${{ needs.tools-lifecycle-test.result }}
        run: |
          python3 -c "
import os, sys

lint_res = os.environ.get('LINT_RES', 'unknown')
matrix_res = os.environ.get('MATRIX_RES', 'unknown')
lifecycle_res = os.environ.get('LIFECYCLE_RES', 'unknown')

def badge(s):
    if s == 'success': return '✅ Passed'
    if s == 'skipped': return '⚪ Skipped'
    return '❌ Failed'

passed = (lint_res == 'success' and matrix_res == 'success' and lifecycle_res == 'success')
overall = '✅ ALL CHECKS PASSED (全部通过)' if passed else '❌ SOME CHECKS FAILED (部分检查未通过)'

branch = os.environ.get('GITHUB_REF_NAME', 'develop')
commit = os.environ.get('GITHUB_SHA', '')[:7]

lines = [
    '# 🚀 Dev Scripts CI 全矩阵测试汇总报告\n',
    f'> **分支 (Branch)**: `{branch}` | **提交 (Commit)**: `{commit}`  \n',
    f'> **整体执行状态**: **{overall}**\n\n---\n',
    '### 📋 测试阶段与架构矩阵详情\n\n',
    '| 测试阶段 (Job) | 目标架构与运行环境 | 状态 |\n',
    '| :--- | :--- | :---: |\n',
    f'| 🔍 **代码与语法自检** | `Ubuntu 24.04` (x86_64) | {badge(lint_res)} |\n',
    f'| 🐧 **Linux x86_64 原生矩阵** | `Ubuntu 24.04` (x86_64) | {badge(matrix_res)} |\n',
    f'| 🚀 **Linux ARM64 原生矩阵** | `Ubuntu 24.04 ARM` (aarch64) | {badge(matrix_res)} |\n',
    f'| 🍎 **macOS Apple Silicon** | `macOS 14+` (Apple M-Series) | {badge(matrix_res)} |\n',
    f'| 🔄 **工具链生命周期闭环** | `Ubuntu 24.04` (x86_64) | {badge(lifecycle_res)} |\n\n---\n',
    '### 📦 覆盖的自动化运维与开发脚本 (共 16 个)\n',
    '- 🧰 **基础开发工具**: `go_install.sh`、`nodejs_install.sh`、`git_install.sh`、`protobuf_install.sh`、`vim_go_install.sh`、`gitlint_install.sh`、`env_init.sh`\n',
    '- 🌐 **服务与存储组件**: `filebrowser_install.sh`、`samba_install.sh`、`nginx_download_install.sh`、`derper_install.sh`\n',
    '- 🐳 **容器引擎**: `docker_install.sh`\n',
    '- ⚙️ **工具集**: `tools/codex_switch.sh`、`tools/scan_ip.sh`、`tools/scan_ip2.sh`、`tools/v2ray_conf_setting.sh`\n'
]

summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
if summary_path:
    with open(summary_path, 'a', encoding='utf-8') as sf:
        sf.writelines(lines)

if not passed:
    print('CI 存在未通过的 Job，请检查详细日志。')
    sys.exit(1)
"
